name: Check Source Health

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: source-health-state
  cancel-in-progress: false

jobs:
  check:
    name: Check configured upstreams
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check sources
        id: health
        continue-on-error: true
        run: pnpm run node Build/validate-domain-alive.ts source-health-report.json
        env:
          # Mirror the build's fetch path: kelee.one 403s direct requests from
          # datacenter runner IPs, so probes must use the same Worker proxy.
          PROXY_BASE: https://cloudflare-proxy.lucking.workers.dev
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-health-report
          path: source-health-report.json
          retention-days: 14
      - name: Load durable state
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source-health-state-data
          git fetch --no-tags origin source-health-state || true
          git show origin/source-health-state:state.json > source-health-state-data/state.json 2>/dev/null || echo '{"sources":{}}' > source-health-state-data/state.json
      - name: Apply three-strike state machine
        if: github.event_name == 'schedule'
        run: pnpm run node Build/update-source-health-state.ts source-health-report.json source-health-state-data/state.json source-health-state-data/actions.json
      - name: Manage health issue
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label='source-health'
          title='Automated upstream source health'
          gh label create "$label" --color D93F0B --description 'Automated structured source health alert' --force
          issue=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')
          unhealthy=$(jq -r '[.sources[] | select(.deadStreak >= 3) | .id] | sort | .[]' source-health-state-data/state.json)
          if [ -n "$unhealthy" ]; then
            body=$(printf 'The following configured sources have failed at least three consecutive scheduled checks:\n\n%s\n\nLatest report is attached to this workflow run.' "$(printf '%s\n' "$unhealthy" | sed 's/^/- `/;s/$/`/')")
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --title "$title" --body "$body"
              gh issue comment "$issue" --body "Updated after scheduled check at $(date -u +'%Y-%m-%dT%H:%M:%SZ')."
            else
              gh issue create --label "$label" --title "$title" --body "$body"
            fi
          elif [ -n "$issue" ] && jq -e 'any(.[]; .action == "close")' source-health-state-data/actions.json >/dev/null; then
            gh issue comment "$issue" --body "All alerted sources recovered at $(date -u +'%Y-%m-%dT%H:%M:%SZ')."
            gh issue close "$issue"
          fi
      - name: Persist durable state branch
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tmp=$(mktemp -d)
          cp source-health-state-data/state.json "$tmp/state.json"
          cd "$tmp"
          git init
          git checkout --orphan source-health-state
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add state.json
          git commit -m 'chore: update source health state'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin source-health-state
      - name: Propagate health result
        if: steps.health.outcome == 'failure'
        run: exit 1
