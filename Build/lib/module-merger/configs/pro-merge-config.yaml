# 专业版模块合并配置文件

# 基本信息
name: "All-in-One Pro Ad Blocker"
version: "2.x"
description: "Professional Ad-free Experience with comprehensive module coverage"
category: "🛡️ MirrRule Pro"
author: "@lucking7"

# 要合并的模块列表
#
# 字段说明:
#   url:              模块文件路径（支持 file:// 本地路径或 http(s):// 远程地址）
#   header:           模块显示名称（用于分隔符和参数命名）
#   scriptToggle:     是否为该模块生成脚本开关参数（默认 true，基础过滤模块设为 false）
#   scriptDefaultOn:  脚本开关是否默认开启（默认 false，用户常用模块设为 true）
#
modules:
  # HTTPDNS拦截器（基础过滤，固定启用）
  - url: "file://public/Modules/Converted/HTTPDNS拦截器.sgmodule"
    header: "HTTPDNS拦截器"
    scriptToggle: false

  # 可莉广告过滤器（基础过滤，固定启用）
  - url: "file://public/Modules/Converted/可莉广告过滤器.sgmodule"
